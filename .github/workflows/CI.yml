name: CI
on:
  push:
    branches:
      - master
      - lp/**
  pull_request:
  workflow_dispatch:
env:
  JULIA_NUM_THREADS: 2
jobs:
  test-cpu:
    # CUDA.jl loads on public runners without a device; GPU-only assertions gate
    # themselves on CUDA.functional(). Every group uses the root package project.
    name: CPU ${{ matrix.group }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
        group:
          - tensors
          - networks
          - exhaustive
          - engine
          - umbrella
    env:
      SPINGLASS_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
        with:
          project: .
      - uses: julia-actions/julia-runtest@latest
        with:
          project: .
  test-gpu:
    name: GPU ${{ matrix.group }} - Julia ${{ matrix.version }}
    runs-on: [self-hosted, titan, gpu]
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
        group:
          - tensors
          - networks
          - exhaustive
          - engine
          - umbrella
    env:
      SPINGLASS_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
        with:
          project: .
      - uses: julia-actions/julia-runtest@latest
        with:
          project: .
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          flags: gpu-${{ matrix.group }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
