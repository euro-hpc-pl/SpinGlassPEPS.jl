name: CI
on:
  push:
    branches:
      - master
      - lp/**
  pull_request:
  workflow_dispatch:
env:
  JULIA_NUM_THREADS: 2
jobs:
  test-cpu:
    # CPU leg on public runners: CUDA.jl loads without a GPU; tests must gate GPU
    # paths on CUDA.functional(). SpinGlassExhaustive is GPU-only, so it is excluded.
    name: CPU ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
        package:
          - SpinGlassTensors
          - SpinGlassNetworks
          - SpinGlassEngine
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
        with:
          project: lib/${{ matrix.package }}
      - uses: julia-actions/julia-runtest@latest
        with:
          project: lib/${{ matrix.package }}
  test-gpu:
    name: GPU ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: [self-hosted, titan, gpu]
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
        package:
          - SpinGlassTensors
          - SpinGlassNetworks
          - SpinGlassEngine
          - SpinGlassExhaustive
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
        with:
          project: lib/${{ matrix.package }}
      - uses: julia-actions/julia-runtest@latest
        with:
          project: lib/${{ matrix.package }}
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: lib/${{ matrix.package }}/src
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  test-umbrella:
    name: Umbrella - Julia ${{ matrix.version }}
    runs-on: [self-hosted, titan, gpu]
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
